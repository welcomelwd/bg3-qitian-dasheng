name: Validate mod specs

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate design specs
        run: python scripts/validate_specs.py

      - name: Validate class/resource spine
        run: python scripts/validate_class_resource_spine.py

      - name: Validate Monkey Agility
        run: python scripts/validate_monkey_agility.py

      - name: Validate Stats drafts
        run: python scripts/validate_stats_drafts.py

      - name: Validate transform prototypes
        run: python scripts/validate_transform_specs.py

      - name: Validate hair clone prototype
        run: python scripts/validate_hair_clone_specs.py

      - name: Validate defense passives
        run: python scripts/validate_defense_passives.py

      - name: Validate Three Heads Six Arms
        run: python scripts/validate_three_heads_six_arms.py

      - name: Validate Victorious Buddha subclass
        run: python scripts/validate_victorious_buddha.py

      - name: Validate Seventy-Two Changes subclass
        run: python scripts/validate_seventy_two_changes.py

      - name: Validate Spiritual Stone Monkey subclass
        run: python scripts/validate_spiritual_stone_monkey.py

      - name: Validate integration audit
        run: python scripts/validate_integration_audit.py

      - name: Validate Fa Tian Xiang Di
        run: python scripts/validate_fa_tian_xiang_di.py

      - name: Validate Qitian Dasheng capstone
        run: python scripts/validate_qitian_dasheng.py

      - name: Check cross-file consistency
        run: python scripts/check_consistency.py
