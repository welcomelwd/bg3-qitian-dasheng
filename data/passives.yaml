    v0_1: false
  - tech_name: QTD_Passive_ThreeHeadsSixArms
    display_name: 三头六臂
    v0_1: false
  - tech_name: QTD_Passive_FaTianXiangDi
    display_name: 法天象地
    v0_1: false
    unlock_level: 11
    unlocks: Shout_QTD_FaTianXiangDi
    target_version: V0.4
    implementation_note: "巨化机制位于 src/stats/FaTianXiangDi.txt；首版使用 Enlarge 同源 ObjectSize(+1)/ScaleMultiplier(1.33)，真正 Huge 碰撞需 Toolkit 验证。"
  - tech_name: QTD_Passive_QitianDasheng
    display_name: 齐天大圣
    v0_1: false
    unlock_level: 12
    target_version: V1.0
    role: capstone_passive
    intent:
      - 仙力上限 +2，使 L12 预期总上限达到 8
      - Movement +3m
      - 免疫魅惑状态组
      - 免疫恐惧状态组
      - 不新增主动大招，不增加 Action/Bonus Action，不继续提升 Extra Attack 链
    implementation_note: "使用 PassiveData Boosts：ActionResource(QTD_SageQi,2,0);MovementSpeed(3);StatusImmunity(SG_Charmed);StatusImmunity(SG_Frightened)。"
