passives:
  - tech_name: QTD_Passive_MonkeyAgility
    display_name: 灵猴身法
    v0_1: true
    intent:
      - 无中甲、重甲或盾牌时，AC 由 10 + DEX 修正 + WIS 修正构成
      - Movement +3m
      - Jump Distance +50%
      - 降低坠落伤害
    implementation_note: "优先克隆/组合原版未着甲防御、移动与坠落相关被动，在 Toolkit 中确认 Boost/Functor。"

  - tech_name: QTD_Passive_RuyiMastery
