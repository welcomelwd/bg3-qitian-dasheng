passives:
  - tech_name: QTD_Passive_MonkeyAgility
    display_name: 灵猴身法
    v0_1: true
    runtime_state: vanilla-pattern-aligned-draft
    visible_effect:
      unarmored_ac: 10 + DEX modifier + WIS modifier
      conditions:
        - not WearingArmor(context.Source)
        - not HasShieldEquipped(context.Source)
    helper: QTD_Passive_MonkeyAgility_Mobility
    helper_effects:
      movement_bonus_m: 3
      jump_distance_multiplier: 1.5
      fall_damage_multiplier: 0.5
    implementation_note: "可见被动使用 ACOverrideFormula(10,true,Dexterity,Wisdom) + OnEquip/OnCreate 条件；隐藏 helper 使用 ActionResource(Movement,3,0)、JumpMaxDistanceMultiplier(1.5)、FallDamageMultiplier(0.5)。仍需 Patch 8 Toolkit 实测装备切换与坠落伤害。"

  - tech_name: QTD_Passive_RuyiMastery
    display_name: 如意兵法
    v0_1: true
    runtime_state: monk-weapon-pattern-aligned-draft
    behavior:
      dexterity_gate: IsDexterityGreaterThanStrength()
      attack_override: MonkWeaponAttackOverride()
      strength_when_not_higher: natural_weapon_path
    boost_context:
      - OnStatusApply
      - OnStatusRemove
      - OnEquip
      - OnShortRest
      - OnCreate
      - OnLongRest
      - OnInventoryChanged
    intended_primary_weapons:
      - Quarterstaff
      - WPN_QTD_RuyiJinguBang
    runtime_controls:
      - STR higher than DEX must remain STR
      - DEX higher than STR must switch eligible monk-weapon attack and damage to DEX
      - equal STR and DEX must remain on the natural STR path
      - verify a normal Quarterstaff is treated as monk-eligible
      - verify WPN_QTD_RuyiJinguBang remains monk-eligible after real Quarterstaff Parent is assigned
      - test a non-quarterstaff monk-eligible simple weapon to measure the built-in scope before deciding whether V0.1 needs a narrower weapon predicate
    implementation_note: "首版复用成熟 Martial Arts 模式：IsDexterityGreaterThanStrength() + MonkWeaponAttackOverride()。不强制 WeaponAttackRollAbilityOverride(Dexterity)，也不向所有武器写入 Finesse。真正 Quarterstaff-only 条件仅在找到可靠 Toolkit/Stats 谓词后再考虑。"

  - tech_name: QTD_Passive_CopperHeadIronArm
    display_name: 铜头铁臂
    v0_1: true
    runtime_state: interrupt-pattern-aligned-draft
    unlock_level: 2
    interrupt: QTD_Interrupt_CopperHeadIronArm
    reaction_cost: ReactionActionPoint:1
    interrupt_context: OnPreDamage
    damage_types:
      - Bludgeoning
      - Piercing
      - Slashing
    reduction: 1d8 + WisdomModifier
    temporary_status: QTD_STATUS_COPPER_HEAD_IRON_ARM_REDUCTION
    cleanup_passive: QTD_Passive_CopperHeadIronArm_Cleanup
    polymorph_behavior: disabled
    runtime_controls:
      - decline must not spend Reaction or reduce damage
      - accept must spend exactly one Reaction
      - elemental rider damage must not be reduced
      - zero-damage prevention must still clean up the temporary status
      - multi-component physical attacks must not receive unintended repeated reduction
      - verify ordering with L9 Diamond Body resistance
    implementation_note: "使用 OnPreDamage YesNoDecision Interrupt，在接受时临时施加只含 Bludgeoning/Piercing/Slashing DamageReduction 的 BOOST 状态；OnDamaged/OnDamagedPrevented 后清理。仍需 Patch 8 Toolkit 实机验证。"

  - tech_name: QTD_Passive_CloudMomentum_Consume
    display_name: 云势消费 helper
    v0_1: true
    runtime_state: onattack-cleanup-draft
    properties: IsHidden
    context: OnAttack
    condition: IsMeleeAttack()
    effect: RemoveStatus(SELF,QTD_STATUS_CLOUD_MOMENTUM)
    implementation_note: "只在首次近战攻击事件后消费云势；必须在 Patch 8 Toolkit 确认 Advantage 已在 cleanup 前被攻击骰读取。"

  - tech_name: QTD_Passive_SomersaultCloud_Range_L5
    display_name: 筋斗云距离成长 L5
    v0_1: true
    runtime_state: spell-variant-range-draft
    properties: IsHidden
    unlock_level: 5
    modifier: ModifyTargetRadius(Multiplicative,1.25)

  - tech_name: QTD_Passive_SomersaultCloud_Range_L9
    display_name: 筋斗云距离成长 L9
    v0_1: true
