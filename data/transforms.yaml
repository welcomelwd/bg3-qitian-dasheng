ability_whitelist_policy:
  default: deny
  candidates:
    - fiery_golden_eyes_passive_component
    - selected_mobility_abilities
    - form_specific_qitian_passives

compatibility:
  never_override_shared_wildshape_spell: true
  never_override_shared_polymorph_status: true
  qitian_entries_use_own_uuids: true
  inherit_vanilla_effective_chain: true
  final_truth_is_local_patch8_toolkit: true
