spells:
  - tech_name: Target_QTD_SomersaultCloud
    display_name: 筋斗云
    level: 2
    v0_1: true
    runtime_state: momentum-range-scaling-draft
    action_cost: BonusAction
    sage_qi_cost: 1
    base_range_m: 12
    parent_reference: Target_MistyStep
    spell_properties:
      - TeleportSource()
      - ApplyStatus(SELF,QTD_STATUS_CLOUD_MOMENTUM,100,1)
    cloud_momentum:
      status: QTD_STATUS_CLOUD_MOMENTUM
      duration_turns: 1
      effect: 下一次近战攻击获得 Advantage
      consume_event: first melee OnAttack
      ranged_attacks_do_not_consume: true
    scaling:
      2: 12
      5: 15
      9: 18
      12: 21
    scaling_implementation:
      level_5_passive: QTD_Passive_SomersaultCloud_Range_L5
      level_5_multiplier: 1.25
      level_9_passive: QTD_Passive_SomersaultCloud_Range_L9
      level_9_multiplier: 1.2
      level_12_passive: QTD_Passive_SomersaultCloud_Range_L12
      level_12_multiplier: 1.1666667
      mechanism: UnlockSpellVariant + ModifyTargetRadius(Multiplicative,...)
    toolkit_gates:
      - confirm TeleportSource then ApplyStatus(SELF) timing
      - confirm Cloud Momentum Advantage is read before OnAttack cleanup removes the status
      - confirm range multipliers stack to 12/15/18/21m without duplicate hotbar variants
      - verify inherited Misty Step floor targeting flags, animation and VFX

  - tech_name: Zone_QTD_SeaCalmingStrike
    display_name: 定海一棒
    level: 3
    v0_1: true
    runtime_state: weapon-zone-scaling-draft
    parent_reference: Zone_Cleave
    action_cost: Action
    sage_qi_cost: 2
    geometry:
      shape: Cone
      range_m: 3
      angle_deg: 120
      target: Enemy character
    save: Strength
    weapon_component:
      damage: MainMeleeWeapon
      damage_type: MainWeaponDamageType
      weapon_functors: GROUND:ExecuteWeaponFunctors(MainHand)
      applies_on_save_success: true
    thunder_scaling:
      level_3: 2d8
      level_5: 3d8
      level_11: 4d8
      successful_save: half thunder damage
    on_failed_save:
      - Prone 1 turn
      - Knockback 3m
    runtime_controls:
      - confirm main-hand weapon damage applies once per affected target
      - confirm main-hand weapon functors do not duplicate unexpectedly across multiple targets
      - confirm successful Strength save keeps full weapon damage but halves only Thunder damage
      - confirm failed Strength save applies Prone and 3m knockback
      - confirm level bands are exactly L3-4 2d8, L5-10 3d8, L11-12 4d8
      - confirm unarmed or invalid-main-hand behavior is acceptable or add a weapon requirement gate
    implementation_note: "继承 Zone_Cleave 的成熟武器扇区链，使用 MainMeleeWeapon + MainWeaponDamageType，并保留 GROUND:ExecuteWeaponFunctors(MainHand)。再将命中判定改为 STR 豁免，并叠加等级成长的 Thunder 伤害与失败控制。实机验证由项目所有者完成。"

  - tech_name: Target_QTD_FieryGoldenEyes
    display_name: 火眼金睛
    level: 6
    v0_1: true
    action_cost: BonusAction
    sage_qi_cost: 1
    range_m: 18
    duration_turns: 3
    target_status: QTD_STATUS_DEMON_REVEALED
    intent:
      - 显形/反隐身
      - 目标 AC -2
      - 本体攻击目标获得 Advantage
      - 对指定妖邪类型预留 +1d6 Radiant 扩展
