statuses:
  - tech_name: QTD_STATUS_CLOUD_MOMENTUM
    display_name: 云势
    duration: 1_turn
    runtime_state: next-melee-advantage-draft
    boosts:
      - IF(IsMeleeAttack()):Advantage(AttackRoll)
    helper_passive: QTD_Passive_CloudMomentum_Consume
    intent: "下一次近战攻击获得 Advantage；首次近战攻击事件后移除。远程攻击不会消耗云势。"
    toolkit_gate: "确认 OnAttack cleanup 在攻击骰读取 Advantage 后触发，且命中/未命中都会消费。"

  - tech_name: QTD_STATUS_DEMON_REVEALED
    display_name: 妖邪显形
    duration: 3_turns
    runtime_state: source-bound-reveal-draft
    stack_id: QTD_STATUS_DEMON_REVEALED
    on_apply:
      - RemoveStatus(SG_Invisible)
    boosts:
      - AC(-2)
      - StatusImmunity(SG_Invisible)
    attacker_passive: QTD_Passive_FieryGoldenEyes_TargetAdvantage
    attacker_condition: "HasStatus('QTD_STATUS_DEMON_REVEALED',context.Target,context.Source)"
    attacker_bonus: Advantage(AttackRoll)
    intent: "施加时移除当前隐形；持续期间阻止 SG_Invisible；目标 AC -2；仅施加该显形状态的 Great Sage 对该目标攻击获得 Advantage。"
    toolkit_gates:
      - confirm RemoveStatus(SG_Invisible) reveals all normal invisibility variants
      - confirm StatusImmunity(SG_Invisible) prevents re-entering normal invisibility during the 3-turn duration
      - confirm source-bound HasStatus third-argument ownership means another Great Sage does not gain the caster's Advantage
      - confirm recasting refreshes/replaces the status without source ownership becoming stale
